# Resultados completos (xG, cantos) + previsões novas com os ajustes do agente — 2x por dia.
# A rotina de notícias do agente corre às 9h; esta corre depois, para aplicar os ajustes dela.
name: Previsões
on:
  schedule:
    - cron: "30 10 * * *"
    - cron: "30 17 * * *"
  workflow_dispatch:
concurrency:
  group: dados
  cancel-in-progress: false
jobs:
  previsoes:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_GRATIS: ${{ secrets.TELEGRAM_CHAT_GRATIS }}
      TELEGRAM_ADMIN: ${{ secrets.TELEGRAM_ADMIN }}
      TELEGRAM_ADMIN_BOT_TOKEN: ${{ secrets.TELEGRAM_ADMIN_BOT_TOKEN }}
      TZ: Europe/Lisbon
      AFILIADO_LINK: ${{ secrets.AFILIADO_LINK }}
      AFILIADO_CASA: ${{ secrets.AFILIADO_CASA }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: claude/dados
          path: dados
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: dados/cache
          key: cache-${{ github.run_id }}
          restore-keys: cache-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-core.txt
      - run: pip install -q -r requirements-core.txt
      - run: python run.py tudo
      - name: Telegram (dicas do dia, uma vez por dia; balanço à segunda)
        continue-on-error: true
        run: python run.py telegram dicas; python run.py telegram balanco; python run.py telegram painel 20
      - run: bash scripts/guardar_dados.sh "previsões" ours
