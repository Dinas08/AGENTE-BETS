# Resultados dos jogos previstos que acabaram (ESPN) — de 30 em 30 min nas horas de jogos (Lisboa ≈ UTC).
name: Resultados
on:
  schedule:
    - cron: "*/30 11-23 * * *"
    - cron: "20 0 * * *"   # jogos que acabam perto da meia-noite
  workflow_dispatch:
concurrency:
  group: dados
  cancel-in-progress: false
jobs:
  resultados:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: claude/dados
          path: dados
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: dados/cache
          key: cache-${{ github.run_id }}
          restore-keys: cache-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-core.txt
      - run: pip install -q -r requirements-core.txt
      - run: python run.py auto && tail -n 1 dados/auto.log
      - run: bash scripts/guardar_dados.sh "resultados" ours
