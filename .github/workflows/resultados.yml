# Resultados dos jogos previstos que acabaram (ESPN) — de 10 em 10 min, a toda a hora (há jogos das Américas
# de madrugada), para o Green/Red sair no Telegram logo a seguir ao apito final.
name: Resultados
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
concurrency:
  group: dados
  cancel-in-progress: false
jobs:
  resultados:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_GRATIS: ${{ secrets.TELEGRAM_CHAT_GRATIS }}
      TELEGRAM_ADMIN: ${{ secrets.TELEGRAM_ADMIN }}
      TZ: Europe/Lisbon
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      AFILIADO_LINK: ${{ secrets.AFILIADO_LINK }}
      AFILIADO_CASA: ${{ secrets.AFILIADO_CASA }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: claude/dados
          path: dados
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: dados/cache
          key: cache-${{ github.run_id }}
          restore-keys: cache-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-core.txt
      - run: pip install -q -r requirements-core.txt
      - run: python run.py auto
      - name: Telegram (Green/Red, dicas tardias com onzes, madrugada às 22h, mensagens privadas)
        continue-on-error: true
        run: |
          for c in resultados tardias madrugada "painel 8"; do python run.py telegram $c || echo "telegram $c falhou"; done
      - run: bash scripts/guardar_dados.sh "resultados" ours
