[server]
headless = true
port = 8501
# aceita ligações de outros dispositivos da tua rede (telemóvel, tablet, portátil)
address = "0.0.0.0"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

# Tema com as cores do Agente Claudio: preto, laranja terracota e creme
[theme]
base = "dark"
primaryColor = "#e07a52"
backgroundColor = "#0e0e10"
secondaryBackgroundColor = "#16161a"
textColor = "#f3ede3"
linkColor = "#f0956f"
borderColor = "#26262d"
font = "sans-serif"
baseRadius = "medium"
